<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto - BarrioShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">
    <div class="max-w-lg mx-auto bg-white p-8 rounded-2xl shadow-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">📦 Publicar Nuevo Producto</h1>
        <p class="text-sm text-gray-500 mb-6">Añade productos o promociones al catálogo de tu negocio.</p>
        
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-sm">
                Guardar y Publicar Producto
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <a href="{% url 'home' %}" class="text-sm text-blue-600 hover:underline font-medium">← Volver al inicio</a>
        </div>
    </div>
</body>
</html>
