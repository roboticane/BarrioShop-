<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Negocio - BarrioShop</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    
    <!-- ENCABEZADO -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">⚙️ Configuración del Negocio</h1>
            <a href="{% url 'dashboard' %}" class="text-xs bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded-lg font-medium transition">
                ← Volver al Panel
            </a>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm p-6 md:p-8">
            <h2 class="text-lg font-bold text-gray-800 mb-6 border-b pb-3">Actualiza los datos y horarios de tu establecimiento</h2>

            <!-- Formulario de Edición con Token CSRF incluido -->
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                {% for field in form %}
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                            <p class="text-[11px] text-gray-400 mt-0.5">{{ field.help_text }}</p>
                        {% endif %}
                        {% for error in field.errors %}
                            <p class="text-xs text-red-600 mt-1">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}

                <!-- BOTONES DE ACCIÓN -->
                <div class="pt-4 border-t flex justify-end gap-3">
                    <a href="{% url 'dashboard' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-semibold px-5 py-2.5 rounded-xl transition">
                        Cancelar
                    </a>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-6 py-2.5 rounded-xl transition shadow-sm">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
