<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Negocios - BarrioShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
        <div class="text-center mb-6">
            <span class="text-4xl">🔐</span>
            <h1 class="text-2xl font-bold text-gray-800 mt-2">Portal de Negocios</h1>
            <p class="text-sm text-gray-500">Inicia sesión para administrar tu tienda</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl transition shadow-sm">
                Iniciar Sesión
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{% url 'home' %}" class="text-xs text-blue-600 hover:underline">← Volver al inicio</a>
        </div>
    </div>
</body>
</html>
